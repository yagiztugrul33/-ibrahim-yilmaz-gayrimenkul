      <stop offset="0%" stop-color="#0a1a36"/>
      <stop offset="100%" stop-color="#13294f"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003da5"/>
