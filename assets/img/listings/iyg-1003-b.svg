  <text x="40" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f4f6fa" font-weight="700">Altındağ Satılık Dükkan</text>
  <text x="40" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dc1c2e" font-weight="600">Dükkan İçi</text>
