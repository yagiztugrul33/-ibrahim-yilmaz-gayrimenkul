# Cloudflare Worker yapılandırması — statik siteye ek olarak
# /api/haberler adresinde canlı kentsel dönüşüm haberleri servis eder.
#
# ÖNEMLİ: "name" alanını Cloudflare panelindeki MEVCUT Worker adıyla
# birebir aynı yapın (Workers & Pages > ilgili proje > üstteki isim).
# Farklı bir isimle deploy edilirse yeni/ayrı bir Worker oluşur ve
# ibrahimyilmazgayrimenkul.com'a bağlı olan mevcut Worker güncellenmez.
name = "ibrahim-yilmaz-gayrimenkul"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
# TEŞHİS AMAÇLI GEÇİCİ DEĞİŞİKLİK: run_worker_first önceden path listesi
# (array) olarak tanımlıydı ama canlıda hiçbir path'te devreye girmediği
# gözlemlendi (jenerik içerik + cf-cache-status: HIT, x-worker-ran header'ı
# gelmiyor). Cloudflare Community'de bilinen bir platform sorunu var:
# "assets.run_worker_first: true is recorded as raw_run_worker_first: false
# on upload" — yani config doğru olsa bile deploy edilen worker versiyonuna
# bazen yanlış kaydediliyor. Bunu ayırt etmek için geçici olarak TÜM
# istekleri Worker'a yönlendiren boolean forma geçildi (en geniş, en
# kesin teşhis testi): eğer bu da devreye girmezse sorun kesinlikle
# Cloudflare platformu tarafında demektir, path listesi sözdiziminde değil.
# worker/index.js içindeki fetch() handler'ı zaten run_worker_first
# kapsamına girmeyen tüm path'leri env.ASSETS.fetch(request) ile normal
# şekilde geçiriyor, dolayısıyla statik dosyalar (CSS/JS/görsel) yine
# doğru servis edilir. Teyit sonrası tekrar path listesine daraltılacak.
run_worker_first = true
