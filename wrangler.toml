# Cloudflare Worker yapılandırması — statik siteye ek olarak
# /api/haberler adresinde canlı kentsel dönüşüm haberleri servis eder.
#
# ÖNEMLİ: "name" alanını Cloudflare panelindeki MEVCUT Worker adıyla
# birebir aynı yapın (Workers & Pages > ilgili proje > üstteki isim).
# Farklı bir isimle deploy edilirse yeni/ayrı bir Worker oluşur ve
# ibrahimyilmazgayrimenkul.com'a bağlı olan mevcut Worker güncellenmez.
name = "ibrahim-yilmaz-gayrimenkul"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
# ÖNEMLİ: Bu liste olmadan, aşağıdaki path'ler birer statik dosyaya karşılık
# geldiği için Cloudflare Assets platformu bunları Worker'ı (worker/index.js)
# HİÇ ÇALIŞTIRMADAN doğrudan kenardan (edge) servis eder/cache'ler — bu da
# worker/index.js içindeki ilana/rehbere/bölgeye özel SEO meta + JSON-LD
# enjeksiyonunun (withSeoMeta, withLandingItemList) production'da asla
# devreye girmemesine yol açar (jenerik statik içerik + cf-cache-status: HIT
# olarak gözlemlendi). run_worker_first, bu path'lerde Worker'ın asset
# katmanından ÖNCE çalışmasını zorunlu kılar; Worker içeride yine
# env.ASSETS.fetch() ile asıl HTML'i çekip HTMLRewriter ile değiştiriyor.
run_worker_first = [
  "/index.html",
  "/ilan-detay.html",
  "/rehber-detay.html",
  "/ilanlar.html",
  "/iskitler-satilik-daire",
  "/iskitler-satilik-daire.html",
  "/iskitler-kiralik-daire",
  "/iskitler-kiralik-daire.html",
  "/iskitler-satilik-dukkan",
  "/iskitler-satilik-dukkan.html",
  "/iskitler-kiralik-dukkan",
  "/iskitler-kiralik-dukkan.html",
  "/iskitler-satilik-arsa",
  "/iskitler-satilik-arsa.html",
  "/altindag-satilik-daire",
  "/altindag-satilik-daire.html",
  "/altindag-kiralik-daire",
  "/altindag-kiralik-daire.html"
]
